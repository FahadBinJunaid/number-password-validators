<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center p-4">
    <div id="main_contanier" class="w-full max-w-md">
        <div id="main_box" class="bg-white rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.15)] p-8 sm:p-10 border border-gray-100">
            <!-- Header -->
              <div class="mb-16 border bg-gray-200 rounded-2xl h-10 flex flex-col justify-center items-center text-blue-600 hover:scale-[1.05] transition-all cursor-pointer"><a href="../02_Password_Validator/../index.html">For Number Checker <span class="underline">Click Here</span></a></div>
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <span class="text-3xl">🔒</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Password Validator</h1>
                <p class="text-gray-400 mt-1.5 text-sm sm:text-base">Enter your password to login</p>
            </div>

            <!-- Input Area -->
            <div id="sub_box" class="space-y-4">
                <input type="password" id="password_input" placeholder="Enter your password"
                    class="w-full h-14 px-5 rounded-2xl border-2 border-gray-200 bg-gray-50 text-gray-900 text-lg outline-none focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-100 transition-all duration-200 placeholder:text-gray-400">
                <button id="Login"
                    class="w-full h-14 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold text-lg hover:from-indigo-700 hover:to-purple-700 hover:shadow-lg hover:shadow-indigo-200 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer">
                    <span>Login</span>
                    <span class="text-xl">→</span>
                </button>
            </div>

            <!-- Result -->
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-[0.2em]">Result</p>
                <h3 class="text-xl font-bold text-gray-800 mt-4 min-h-[3.5rem] flex items-center justify-center">—</h3>
                <h3 id="result" class="text-xl font-bold text-red-500 mt-4 min-h-[3.5rem] flex items-center justify-center"></h3>
            </div>
        </div>
    </div>

    <!-- Custom Alert Popup -->
    <div id="alertBox" class="fixed inset-0 bg-black/40 flex items-center justify-center hidden">
        <div class="bg-white rounded-3xl p-10 text-center shadow-2xl max-w-sm mx-4">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-3xl">✅</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Login Successful</h2>
            <p class="text-gray-400 mt-2">Redirecting you now...</p>
        </div>
    </div>
</body>
<script src="password_checker.js"></script>
</html>
